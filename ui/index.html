<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MediBridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F6F0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F5F6F0;
    --surface: #FFFFFF;
    --ink: #131714;
    --ink-muted: #4C5A50;
    --border: #DBE1DB;
    --accent: oklch(52% 0.12 230);
    --accent-soft: oklch(95% 0.03 230);
  }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: "General Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  html, body, #root { height: 100%; }
  #root { width: 100vw; }
  * { box-sizing: border-box; }
  /* prevent iOS rubber-band scrolling on the shell; inner scroll containers still scroll */
  body { overscroll-behavior-y: none; }
  input, button, textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--accent) 30%, #9db3ff 70%); border-radius: 999px; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.98); }
  }
  @keyframes shimmer {
    0% { background-position: -250px 0; }
    100% { background-position: calc(100% + 250px) 0; }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script src="tokens.js"></script>

<script type="text/babel" src="screens/chat.jsx"></script>
<script type="text/babel" src="screens/calc.jsx"></script>
<script type="text/babel" src="screens/clinics-profile.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
